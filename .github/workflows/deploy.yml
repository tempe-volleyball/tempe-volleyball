name: Deploy

# Merge to main -> check -> migrate + deploy staging -> (manual approval) -> migrate + deploy production.
# The approval comes from the "production" GitHub environment's required reviewers (repo settings).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  staging:
    needs: check
    if: vars.CLOUDFLARE_READY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Migrations run BEFORE the new code ships, so every migration must be safe for the
      # currently deployed code too (add columns/tables first, drop them in a later release).
      - run: npx wrangler d1 migrations apply DB --env staging --remote
      - run: npm run build
        env: { CLOUDFLARE_ENV: staging }
      - run: npx wrangler deploy --message "${{ github.sha }}"
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 "${{ vars.STAGING_URL }}/api/health"

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx wrangler d1 migrations apply DB --env production --remote
      - run: npm run build
        env: { CLOUDFLARE_ENV: production }
      - run: npx wrangler deploy --message "${{ github.sha }}"
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 "${{ vars.PRODUCTION_URL }}/api/health"
