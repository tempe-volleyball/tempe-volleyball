name: Nightly D1 backup

# Exports the production database to the private R2 bucket "tempevb-backups".
# 30-day retention is an R2 lifecycle rule on the bucket (one-time setup, see PLAN.md), not this script.
# D1 Time Travel separately gives 7 days of point-in-time restore on the free plan.

on:
  schedule:
    - cron: '30 16 * * *' # 03:30 Sydney in summer (AEDT), 02:30 in winter (AEST)
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.CLOUDFLARE_READY == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Export production D1
        run: npx wrangler d1 export tempevb-production --env production --remote --output backup.sql
      - name: Check the export isn't empty
        run: test "$(wc -c < backup.sql)" -gt 100
      - name: Upload to R2
        run: |
          gzip -9 backup.sql
          key="d1/production/$(TZ=Australia/Sydney date +%Y-%m-%d).sql.gz"
          npx wrangler r2 object put "tempevb-backups/$key" --file backup.sql.gz --content-type application/gzip --remote
          echo "Backed up to tempevb-backups/$key" >> "$GITHUB_STEP_SUMMARY"
