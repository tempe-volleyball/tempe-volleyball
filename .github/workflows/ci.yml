name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { CLOUDFLARE_ENV: staging }

  # Uploads a preview version of the staging Worker (not deployed to staging traffic) and
  # links it in the job summary. Previews share the STAGING database and bucket, and migrations
  # are NOT applied from PRs, so a PR that adds a migration only works in preview after merge.
  preview:
    needs: check
    # Skip for forks (no secrets) and when the Cloudflare secrets aren't set up yet.
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_READY == 'true'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { CLOUDFLARE_ENV: staging }
      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}" | tee upload.log
          echo "### Preview" >> "$GITHUB_STEP_SUMMARY"
          grep -Eo 'https://[^ ]+workers\.dev[^ ]*' upload.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
